<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMentory Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top center, #1a1a2e 0%, #0a0a0a 100%); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-text { text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col">

    <nav class="w-full py-6 px-8 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600 rounded-lg shadow-[0_0_15px_rgba(79,70,229,0.4)]">
                <i data-lucide="shield-check" class="text-white"></i>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight text-white neon-text">CyberMentory <span class="text-indigo-500">Checker</span></h1>
        </div>
        <div class="hidden md:flex items-center gap-4 text-xs font-medium text-gray-400">
            <span class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> API Online</span>
            <!-- Gate exibida dinamicamente via PHP -->
            <span class="px-2 py-1 bg-white/5 rounded border border-white/10">Gate: <?php echo $conf['g']; ?></span>
        </div>
    </nav>

    <main class="flex-1 container mx-auto px-4 py-12 max-w-5xl">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-3xl shadow-2xl space-y-6">
                <div class="flex items-center gap-3 mb-2">
                    <i data-lucide="list" class="text-indigo-400"></i>
                    <h2 class="text-lg font-semibold text-white">Lista de Cartões</h2>
                </div>
                <p class="text-sm text-gray-400">Insira seus cartões no formato <span class="text-indigo-300 mono">NUMERO|DATA|CVV</span>. Suporta até 50 linhas.</p>
                <textarea id="cardList" class="w-full h-80 bg-black/40 border border-white/10 rounded-2xl p-4 text-sm mono text-indigo-100 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all custom-scrollbar" placeholder="2230590036356366|07|2028|631..."></textarea>
                <button onclick="startCheck()" id="btnCheck" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                    <i data-lucide="play" size="18"></i> INICIAR VALIDAÇÃO
                </button>
            </div>

            <div class="glass p-8 rounded-3xl shadow-2xl flex flex-col h-full">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <i data-lucide="activity" class="text-indigo-400"></i>
                        <h2 class="text-lg font-semibold text-white">Resultados</h2>
                    </div>
                    <div class="flex gap-3 text-xs font-bold">
                        <span class="text-green-400">LIVE: <span id="countLive">0</span></span>
                        <span class="text-red-400">DIE: <span id="countDie">0</span></span>
                    </div>
                </div>
                <div id="resultsContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2 max-h-[500px]">
                    <div class="text-center py-20 text-gray-500 italic text-sm">Aguardando lista para processar...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-6 text-center border-t border-white/5">
        <p class="text-gray-500 text-sm">
            Dev <a href="https://t.me/cybermentory" target="_blank" class="text-indigo-400 hover:text-indigo-300 font-bold transition-colors underline decoration-indigo-500/30">by cybermentory</a>
        </p>
    </footer>

    <script>
        lucide.createIcons();
        window.startCheck = async function() {
            const list = document.getElementById('cardList').value.trim();
            const btn = document.getElementById('btnCheck');
            const container = document.getElementById('resultsContainer');
            if (!list) { alert('Insira a lista.'); return; }
            btn.disabled = true;
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> PROCESSANDO...`;
            container.innerHTML = '';
            let live = 0, die = 0;
            try {
                const formData = new FormData();
                formData.append('lista', list);
                const response = await fetch('?action=check', { method: 'POST', body: formData });
                const data = await response.json();
                data.forEach(item => {
                    const isLive = item.status === 'LIVE';
                    if (isLive) live++; else die++;
                    const div = document.createElement('div');
                    div.className = `p-4 rounded-xl border flex justify-between items-center animate-in fade-in slide-in-from-right-4 duration-300 ${isLive ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-red-500/10 border-red-500/30 text-red-400'}`;
                    div.innerHTML = `<div class="flex flex-col"><span class="mono text-xs font-bold">${item.card}</span><span class="text-[10px] opacity-70">${item.info}</span></div><span class="text-[10px] font-black px-2 py-1 rounded bg-current text-black">${item.status}</span>`;
                    container.appendChild(div);
                });
                document.getElementById('countLive').innerText = live;
                document.getElementById('countDie').innerText = die;
            } catch (e) {
                container.innerHTML = `<div class="text-red-500 text-center py-10">Erro na API.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="play" size="18"></i> INICIAR VALIDAÇÃO`;
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
